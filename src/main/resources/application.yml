server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  application:
    name: zhida-learning-agent
  servlet:
    multipart:
      file-size-threshold: 1MB
      max-file-size: 20MB
      max-request-size: 24MB

zhida:
  support:
    enabled: ${ZHIDA_SUPPORT_ENABLED:false}
  cost:
    warning-usd: ${ZHIDA_COST_WARNING_USD:0.01}
  auth:
    enabled: ${ZHIDA_AUTH_ENABLED:false}
    secret: ${ZHIDA_JWT_SECRET:}
  execution:
    daily-limit: ${ZHIDA_DAILY_LIMIT:100}
    guest-daily-limit: ${ZHIDA_GUEST_DAILY_LIMIT:5}
    timeout-seconds: ${ZHIDA_TASK_TIMEOUT_SECONDS:90}
    max-tool-calls: ${ZHIDA_MAX_TOOL_CALLS:30}
  persistence:
    enabled: ${ZHIDA_PERSISTENCE_ENABLED:false}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zhida_agent?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:zhida}
    password: ${DB_PASSWORD:}
  ai:
    enabled: ${ZHIDA_AI_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
  conversation-summary:
    enabled: ${ZHIDA_SUMMARY_ENABLED:true}
  search:
    tavily-api-key: ${TAVILY_API_KEY:}
    max-results: 5
  web-reader:
    max-content-length: 12000
  rag:
    upload-dir: ${ZHIDA_UPLOAD_DIR:./data/uploads}
    vector-store-file: ${ZHIDA_VECTOR_STORE_FILE:./data/vector/langchain4j-vector-store.json}
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:}
    max-file-size: 20971520
    max-documents-per-knowledge-base: 20
    chunk-size: 800
    chunk-overlap: 120
    top-k: 5

logging:
  level:
    com.zhida.agent: INFO
