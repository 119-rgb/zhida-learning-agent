services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zhida_agent
      MYSQL_USER: zhida
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    environment:
      ZHIDA_AUTH_ENABLED: "true"
      ZHIDA_PERSISTENCE_ENABLED: "true"
      ZHIDA_JWT_SECRET: ${ZHIDA_JWT_SECRET:?Set a random secret of at least 32 bytes}
      ZHIDA_AI_ENABLED: ${ZHIDA_AI_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      ZHIDA_SUMMARY_ENABLED: ${ZHIDA_SUMMARY_ENABLED:-true}
      ZHIDA_COST_WARNING_USD: ${ZHIDA_COST_WARNING_USD:-0.01}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DB_URL: jdbc:mysql://mysql:3306/zhida_agent?characterEncoding=UTF-8&serverTimezone=UTC
      DB_USERNAME: zhida
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ZHIDA_UPLOAD_DIR: /app/data/uploads
      ZHIDA_VECTOR_STORE_FILE: /app/data/vector/langchain4j-vector-store.json
    volumes:
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
volumes:
  mysql-data:
  app-data:
